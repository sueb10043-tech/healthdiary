    bindVerticalEnterNav(wrap, ".bulk-weight");
    bindVerticalEnterNav(wrap, ".bulk-calories");
    bindVerticalEnterNav(wrap, ".bulk-exercise-cal");
    bindVerticalEnterNav(wrap, ".bulk-steps");
  }

  // Only rows that actually differ from what was loaded need to be sent —
  // otherwise every save re-writes the whole visible month, which is what
  // made bulk saving slow.
  function bulkDraftChanged(a, b) {
    if (a.weight !== b.weight) return true;
    if (a.calories !== b.calories) return true;
    if (a.exercised !== b.exercised) return true;
    if (a.exerciseCalories !== b.exerciseCalories) return true;
    if (a.steps !== b.steps) return true;
    var ac = a.condition.slice().sort().join(",");
    var bc = b.condition.slice().sort().join(",");
    if (ac !== bc) return true;
    return false;
  }

  function saveBulkAll() {
    var toSave = bulkRows.filter(function (iso) { return bulkDraftChanged(bulkOriginal[iso], bulkDraft[iso]); });
    if (toSave.length === 0) {
      document.getElementById("bulkStatus").textContent = "변경된 내용이 없어요.";
      return;
    }
    // Same pattern as the single-day popup: apply everything on screen right
    // away, hand the rows to the save queue, and close. The queue sends them
    // one by one in the background and retries any that fail.
    toSave.forEach(function (iso) {
      var d = bulkDraft[iso];
      var payload = {
        weight: d.weight,
        calories: d.calories,
        condition: d.condition,
        note: d.note,
        exercised: d.exercised,
        exerciseCalories: d.exercised ? d.exerciseCalories : "",
        cheatDay: d.cheatDay,
        drinking: d.drinking,
        waist1: d.waist1,
        waist2: d.waist2,
        steps: d.steps,
        period: !!(state.entries[iso] && state.entries[iso].period),
        existingPhotoFileId: (state.entries[iso] && state.entries[iso].photoFileId) || ""
      };
      state.entries[iso] = {
        weight: d.weight,
        calories: d.calories,
        condition: d.condition.slice(),
        note: d.note,
        exercised: d.exercised,
        exerciseCalories: payload.exerciseCalories,
        cheatDay: d.cheatDay,
        drinking: d.drinking,
        waist1: d.waist1,
        waist2: d.waist2,
        steps: d.steps,
        period: payload.period,
        photo: (state.entries[iso] && state.entries[iso].photo) || "",
        photoFileId: payload.existingPhotoFileId
      };
      enqueueSave(iso, payload);
    });
    showToast(toSave.length + "일 저장 중 — 완료되면 DAILY LOG 옆 점이 초록색으로 바뀌어요");
    closeBulkModal();
    renderCalendar();
  }

  // ---- month-as-image export ---------------------------------------------
  // Draws a plain text/number table (no emoji or color-only signals) so an
  // AI reading the image later can parse every value unambiguously.
  // Exception: period days get the date cell filled pink, matching the
  // calendar's period color.
  var CONDITION_EXPORT_LABELS = {
    success2: "정상 배변",
    success: "단단한 변",
    uncomfortable: "복부 가스",
    allergy: "알러지"
  };

  var PERIOD_COLOR = "#FBEBF0"; // same as .cal-cell.period-flag

  var EXPORT_COLUMNS = [
    { key: "date", label: "날짜", width: 62 },
    { key: "weight", label: "체중(kg)", width: 66 },
    { key: "calories", label: "칼로리(kcal)", width: 82 },
    { key: "condition", label: "컨디션", width: 150 },
    { key: "exercise", label: "운동", width: 46 },
    { key: "exCal", label: "소모(kcal)", width: 70 },
    { key: "waist1", label: "허리1(cm)", width: 70 },
    { key: "waist2", label: "허리2(cm)", width: 70 },
    { key: "steps", label: "걸음수", width: 62 },
    { key: "cheat", label: "치팅", width: 46 },
    { key: "drink", label: "음주", width: 46 }
  ];

  function exportRowValues(e) {
    var condText = e.condition.length
      ? e.condition.map(function (v) { return CONDITION_EXPORT_LABELS[v] || v; }).join(", ")
      : "-";
    return {
      date: e.day + "(" + e.weekday + ")",
      weight: e.weight || "-",
      calories: e.calories || "-",
      condition: condText,
      exercise: e.exercised ? "O" : "-",
      exCal: e.exercised && e.exCal ? e.exCal : "-",
      waist1: e.waist1 || "-",
      waist2: e.waist2 || "-",
      steps: e.steps || "-",
      cheat: e.cheat ? "O" : "-",
      drink: e.drink ? "O" : "-"
    };
  }

  function drawMonthTableCanvas(entries, year, month) {
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");
    var scale = 2;

    var tableW = EXPORT_COLUMNS.reduce(function (a, c) { return a + c.width; }, 0);
    var rowH = 28;
    var headerH = 46;
    var headerRowH = 26;
    var totalW = tableW + 40;
    var totalH = headerH + headerRowH + rowH * entries.length + 20;

    canvas.width = totalW * scale;
    canvas.height = totalH * scale;
    ctx.scale(scale, scale);

    ctx.fillStyle = "#FDFCF8";
    ctx.fillRect(0, 0, totalW, totalH);

    ctx.fillStyle = "#20302B";
    ctx.font = "600 15px 'Work Sans', sans-serif";
    ctx.fillText(year + "년 " + (month + 1) + "월 기록", 20, 26);

    var startX = 20;
    var startY = headerH;

    ctx.fillStyle = "#F3F5EE";
    ctx.fillRect(startX, startY, tableW, headerRowH);
    ctx.fillStyle = "#3A463F";
    ctx.font = "600 11px 'IBM Plex Mono', monospace";
    var hx = startX;
    EXPORT_COLUMNS.forEach(function (col) {
      ctx.fillText(col.label, hx + 6, startY + headerRowH / 2 + 4);
      hx += col.width;
    });

    entries.forEach(function (e, rowIdx) {
      var vals = exportRowValues(e);
      var y = startY + headerRowH + rowIdx * rowH;
      if (rowIdx % 2 === 1) {
        ctx.fillStyle = "#F7F8F4";
        ctx.fillRect(startX, y, tableW, rowH);
      }
      // Period day: fill just the date cell pink (drawn after the stripe so
      // it looks the same on odd and even rows).
      if (e.period) {
        ctx.fillStyle = PERIOD_COLOR;
        ctx.fillRect(startX, y, EXPORT_COLUMNS[0].width, rowH);
      }
      var cx = startX;
      EXPORT_COLUMNS.forEach(function (col) {
        ctx.fillStyle = col.key === "date"
          ? (e.weekday === "일" ? "#C0392B" : e.weekday === "토" ? "#2E5E8C" : "#20302B")
          : "#20302B";
        ctx.font = "12px 'IBM Plex Mono', monospace";
        var text = String(vals[col.key]);
        var maxChars = Math.floor(col.width / 6.2);
        if (text.length > maxChars) text = text.slice(0, maxChars - 1) + "…";
        ctx.fillText(text, cx + 6, y + rowH / 2 + 4);
        cx += col.width;
      });
    });

    ctx.strokeStyle = "#D7DED2";
    ctx.lineWidth = 1;
    var gridH = headerRowH + rowH * entries.length;
    ctx.strokeRect(startX, startY, tableW, gridH);
    var vx = startX;
    EXPORT_COLUMNS.forEach(function (col, i) {
      if (i > 0) {
        ctx.beginPath();
        ctx.moveTo(vx, startY);
        ctx.lineTo(vx, startY + gridH);
        ctx.stroke();
      }
      vx += col.width;
    });
    ctx.beginPath();
    ctx.moveTo(startX, startY + headerRowH);
    ctx.lineTo(startX + tableW, startY + headerRowH);
    ctx.stroke();

    return canvas;
  }

  function exportMonthTableImage() {
    var total = daysInMonth(state.viewYear, state.viewMonth);
    var rows = [];
    for (var d = 1; d <= total; d++) {
      var iso = isoOf(state.viewYear, state.viewMonth, d);
      var entry = state.entries[iso] || {};
      var wd = new Date(iso + "T00:00:00").getDay();
      rows.push({
        day: d,
        weekday: WEEKDAYS[wd],
        weight: entry.weight || "",
        calories: entry.calories || "",
        condition: sortConditionValues(toConditionArray(entry.condition)),
        exercised: !!entry.exercised,
        exCal: entry.exerciseCalories || "",
        waist1: entry.waist1 || "",
        waist2: entry.waist2 || "",
        steps: entry.steps || "",
        cheat: !!entry.cheatDay,
        drink: !!entry.drinking,
        period: !!entry.period
      });
    }
    var canvas = drawMonthTableCanvas(rows, state.viewYear, state.viewMonth);
    var filename = state.viewYear + "년_" + (state.viewMonth + 1) + "월_기록.png";

    canvas.toBlob(function (blob) {
      if (!blob) {
        showToast("이미지 생성에 실패했어요");
        return;
      }
      var file = new File([blob], filename, { type: "image/png" });

      // Anchor-download with a plain click() often silently does nothing on
      // mobile browsers (it just opens the image instead of saving it).
      // The Web Share sheet is the reliable way to get it into Photos there.
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: filename }).catch(function () {
          /* person cancelled the share sheet — not an error */
        });
      } else {
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.download = filename;
        link.href = url;
        link.click();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        showToast("이미지로 저장했어요");
      }
    }, "image/png");
  }

  // ---- weekly average table ----------------------------------------------
  // Weeks are calendar Mon–Sun, expanded outward from the selected range so
  // every week shown is a complete 7-day week (e.g. picking Aug 1 when it
  // falls on a Saturday still shows the full Jul 27–Aug 2 week). Each
  // column's average only counts the days that actually have that field
  // filled in — missing days are skipped, not treated as 0.
  function mondayOfWeek(d) {
    var day = d.getDay(); // 0=Sun..6=Sat
    var diff = day === 0 ? -6 : 1 - day;
    var monday = new Date(d);
    monday.setDate(d.getDate() + diff);
    return monday;
  }

  function fmtWeekDate(d) {
    return (d.getMonth() + 1) + "/" + pad2(d.getDate()) + "(" + WEEKDAYS[d.getDay()] + ")";
  }

  // Mobile label: "10/4" rather than "10/04" — saves a character per date.
  function fmtWeekDateShort(d) {
    return (d.getMonth() + 1) + "/" + d.getDate();
  }

  function average(nums) {
    if (nums.length === 0) return null;
    var sum = nums.reduce(function (a, b) { return a + b; }, 0);
    return sum / nums.length;
  }

  function buildWeeklyRows(startIso, endIso) {
    var start = new Date(startIso + "T00:00:00");
    var end = new Date(endIso + "T00:00:00");
    if (isNaN(start) || isNaN(end) || start > end) return [];

    var weekStart = mondayOfWeek(start);
    var rows = [];
    var guard = 0;
    while (weekStart <= end && guard < 60) {
      var weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);

      var weights = [], calories = [], steps = [];
      var cheatCount = 0, drinkCount = 0;
      var cursor = new Date(weekStart);
      for (var i = 0; i < 7; i++) {
        var iso = isoOf(cursor.getFullYear(), cursor.getMonth(), cursor.getDate());
        var entry = state.entries[iso];
        if (entry) {
          if (entry.weight && !isNaN(parseFloat(entry.weight))) weights.push(parseFloat(entry.weight));
          if (entry.calories && !isNaN(parseFloat(entry.calories))) calories.push(parseFloat(entry.calories));
          if (entry.steps && !isNaN(parseFloat(entry.steps))) steps.push(parseFloat(entry.steps));
          if (entry.cheatDay) cheatCount++;
          if (entry.drinking) drinkCount++;
        }
        cursor.setDate(cursor.getDate() + 1);
      }

      rows.push({
        weekKey: isoOf(weekStart.getFullYear(), weekStart.getMonth(), weekStart.getDate()),
        label: fmtWeekDate(weekStart) + " ~ " + fmtWeekDate(weekEnd),
        // Mobile: end date is always just the day — "10/5~11", "9/28~4".
        labelShort: fmtWeekDateShort(weekStart) + "~" + weekEnd.getDate(),
        weightAvg: average(weights),
        caloriesAvg: average(calories),
        stepsAvg: average(steps),
        cheatCount: cheatCount,
        drinkCount: drinkCount
      });

      weekStart = new Date(weekStart);
      weekStart.setDate(weekStart.getDate() + 7);
      guard++;
    }
    return rows;
  }

  function defaultWeeklyRange() {
    var now = new Date();
    var isCurrentMonth = state.viewYear === now.getFullYear() && state.viewMonth === now.getMonth();
    var startIso = isoOf(state.viewYear, state.viewMonth, 1);
    var endIso = isCurrentMonth
      ? todayStr()
      : isoOf(state.viewYear, state.viewMonth, daysInMonth(state.viewYear, state.viewMonth));
    return { startIso: startIso, endIso: endIso };
  }

  // Holds the set of individually-picked months (e.g. "6월, 8월" skipping
  // July) when the person uses "월 선택" instead of a plain date range.
  // Each selected month contributes its own weekly rows independently, so
  // gaps between non-adjacent months never get bridged into one fake week.
  var weeklySelectedMonths = []; // array of "YYYY-MM" strings

  function monthLabel(ym) {
    var parts = ym.split("-").map(Number);
    return parts[0] + "년 " + parts[1] + "월";
  }

  function monthToIsoRange(ym) {
    var now = new Date();
    var currentYm = now.getFullYear() + "-" + pad2(now.getMonth() + 1);
    var parts = ym.split("-").map(Number);
    var startIso = isoOf(parts[0], parts[1] - 1, 1);
    var endIso = ym === currentYm ? todayStr() : isoOf(parts[0], parts[1] - 1, daysInMonth(parts[0], parts[1] - 1));
    return { startIso: startIso, endIso: endIso };
  }

  function renderWeeklyTable() {
    var body = document.getElementById("weeklyTableBody");
    var rows = [];

    if (weeklySelectedMonths.length > 0) {
      var seenWeeks = {};
      weeklySelectedMonths.slice().sort().forEach(function (ym) {
        var r = monthToIsoRange(ym);
        buildWeeklyRows(r.startIso, r.endIso).forEach(function (row) {
          if (!seenWeeks[row.weekKey]) {
            seenWeeks[row.weekKey] = true;
            rows.push(row);
          }
        });
      });
    } else {
      var startIso = document.getElementById("weeklyStart").value;
      var endIso = document.getElementById("weeklyEnd").value;
      if (!startIso || !endIso || startIso > endIso) {
        body.innerHTML = '<div class="weekly-empty-note">시작일이 종료일보다 앞서야 해요.</div>';
        return;
      }
      rows = buildWeeklyRows(startIso, endIso);
    }

    if (rows.length === 0) {
      body.innerHTML = '<div class="weekly-empty-note">표시할 주가 없어요.</div>';
      return;
    }
    // On mobile, pin every column to the exact px width from
    // MOBILE_WEEKLY_COL_WIDTHS via <colgroup> + inline styles, so CSS can't
    // redistribute them.
    var isMobile = window.matchMedia && window.matchMedia("(max-width: " + MOBILE_MAX_WIDTH + "px)").matches;
    var tableOpen = '<table class="weekly-table">';
    if (isMobile) {
      var totalW = MOBILE_WEEKLY_COL_WIDTHS.reduce(function (a, b) { return a + b; }, 0);
      tableOpen = '<table class="weekly-table" style="table-layout:fixed;width:' + totalW + 'px;min-width:' + totalW + 'px;">' +
        "<colgroup>" + MOBILE_WEEKLY_COL_WIDTHS.map(function (w) {
          return '<col style="width:' + w + 'px;">';
        }).join("") + "</colgroup>";
    }
    var html = tableOpen + '<thead><tr>' +
      '<th>주</th><th>체중<span class="th-avg"> 평균</span><span class="th-unit">(kg)</span></th>' +
      '<th>칼로리<span class="th-avg"> 평균</span><span class="th-unit">(kcal)</span></th>' +
      '<th>걸음<span class="th-su">수</span><span class="th-avg"> 평균</span><span class="th-unit">(보)</span></th>' +
      '<th>치팅</th><th>음주</th>' +
      "</tr></thead><tbody>";
    rows.forEach(function (r) {
      html += "<tr>" +
        '<td class="week-label"><span class="wk-full">' + r.label + '</span><span class="wk-short">' + r.labelShort + "</span></td>" +
        "<td>" + (r.weightAvg === null ? "-" : r.weightAvg.toFixed(1) + '<span class="td-unit">kg</span>') + "</td>" +
        "<td>" + (r.caloriesAvg === null ? "-" : Math.round(r.caloriesAvg) + '<span class="td-unit">kcal</span>') + "</td>" +
        "<td>" + (r.stepsAvg === null ? "-" : Math.round(r.stepsAvg) + '<span class="td-unit">보</span>') + "</td>" +
        "<td>" + (r.cheatCount === 0 ? "-" : r.cheatCount + "회") + "</td>" +
        "<td>" + (r.drinkCount === 0 ? "-" : r.drinkCount + "회") + "</td>" +
        "</tr>";
    });
    html += "</tbody></table>";
    body.innerHTML = html;
  }

  function renderWeeklyMonthTag() {
    var tag = document.getElementById("weeklyMonthTag");
    if (!tag) return;
    if (weeklySelectedMonths.length === 0) {
      tag.innerHTML = "";
      return;
    }
    var labels = weeklySelectedMonths.slice().sort().map(monthLabel).join(", ");
    tag.innerHTML = '선택한 월: ' + labels + ' <a href="#" id="weeklyClearMonths" style="color:#8C4A3C;">✕ 초기화</a>';
    document.getElementById("weeklyClearMonths").addEventListener("click", function (e) {
      e.preventDefault();
      weeklySelectedMonths = [];
      renderWeeklyMonthTag();
      renderWeeklyTable();
    });
  }

  var monthPickerYear = null; // set when the popup opens; persists across ‹ › navigation

  function renderMonthPickerPopup() {

    for (var m = 1; m <= 12; m++) {

        '<div class="month-picker-nav">' +
          '<button type="button" class="nav-arrow" id="monthPickerPrevYear">‹</button>' +
          '<div class="title" style="font-size:15px;">' + monthPickerYear + '년</div>' +
          '<button type="button" class="nav-arrow" id="monthPickerNextYear">›</button>' +

      '</div>';

    if (isNew) {

        '<div class="bulk-overlay" id="monthPickerOverlay" style="z-index:70;">' + innerHtml + '</div>');
    } else {

  function bindMonthPickerPopupEvents() {
    document.getElementById("monthPickerOverlay").addEventListener("click", function (e) {
      if (e.target.id === "monthPickerOverlay") closeMonthPickerPopup();
    });
    document.getElementById("monthPickerCloseBtn").addEventListener("click", closeMonthPickerPopup);
    document.getElementById("monthPickerPrevYear").addEventListener("click", function () {
      monthPickerYear -= 1;
      renderMonthPickerPopup();
    });
    document.getElementById("monthPickerNextYear").addEventListener("click", function () {
      monthPickerYear += 1;
      renderMonthPickerPopup();
    });
    Array.prototype.forEach.call(document.querySelectorAll(".month-grid-btn"), function (btn) {
      btn.addEventListener("click", function () {
        var ym = btn.getAttribute("data-ym");
        var idx = weeklySelectedMonths.indexOf(ym);
        if (idx === -1) weeklySelectedMonths.push(ym); else weeklySelectedMonths.splice(idx, 1);
        btn.classList.toggle("active", idx === -1);
      });
    });
    document.getElementById("monthPickerApplyBtn").addEventListener("click", function () {
      closeMonthPickerPopup();
      renderWeeklyMonthTag();
      renderWeeklyTable();

    monthPickerYear = state.viewYear;
    renderMonthPickerPopup();

  function closeMonthPickerPopup() {
    var el = document.getElementById("monthPickerOverlay");
    if (el) el.remove();
  }

  function openWeeklyModal() {
    weeklySelectedMonths = [];
    var range = defaultWeeklyRange();
    document.getElementById("weeklyModalRoot").innerHTML =
      '<div class="bulk-overlay" id="weeklyOverlay">' +
        '<div class="bulk-modal weekly-modal">' +
          '<div class="bulk-head">' +
            '<div class="title">주간 평균</div>' +
            '<div style="display:flex; gap:8px; align-items:center;">' +
              '<button class="bulk-load-btn" id="weeklyMonthPickBtn">월 선택</button>' +
              '<button class="bulk-close-btn" id="weeklyCloseBtn">✕</button>' +
            '</div>' +
          '</div>' +
          '<div class="weekly-range-row">' +
            '<div class="fld"><label>시작일</label><input type="date" id="weeklyStart" value="' + range.startIso + '" /></div>' +

          '</div>' +
          '<div id="weeklyMonthTag" style="font-size:12px; color:#6B7A70; margin-bottom:10px;"></div>' +
          '<div id="weeklyTableBody"></div>' +

      '</div>';

    document.getElementById("weeklyOverlay").addEventListener("click", function (e) {

    document.getElementById("weeklyModalRoot").innerHTML = "";
  }

  // ---- trend graph -----------------------------------------------------------
  // Two toggles (체중, 허리 치수) — 허리 치수 draws two lines (허리1, 허리2).
  // When both are on, weight uses the left axis (kg) and waist the right (cm).
  var GRAPH_COLORS = { weight: "#5E7A2E", waist1: "#2E6FA8", waist2: "#C2562E" };
  // range: "all" or "months" (only the months picked in 월 선택, as "YYYY-MM").
  var graphState = { weight: true, waist: false, range: "all", months: [] };

  function numOrNull(v) {
    var n = parseFloat(v);
    return isNaN(n) ? null : n;
  }

  function entryHasSelectedData(e) {
    if (!e) return false;
    var hasW = graphState.weight && numOrNull(e.weight) !== null;
    var hasWaist = graphState.waist && (numOrNull(e.waist1) !== null || numOrNull(e.waist2) !== null);
    return hasW || hasWaist;
  }

  function buildGraphData() {
    var todayIso = todayStr();
    // One x position per calendar day, so spacing reflects real time (gaps
    // between waist measurements look as long as they actually were).
    var isoList = [];
    if (graphState.range === "months" && graphState.months.length) {
      // Every day of each picked month (up to today). Months that weren't
      // picked are skipped entirely, e.g. 6월 + 8월 shows no July.
      graphState.months.slice().sort().forEach(function (ym) {
        var parts = ym.split("-").map(Number);
        var total = daysInMonth(parts[0], parts[1] - 1);
        for (var d = 1; d <= total; d++) {
          var iso = isoOf(parts[0], parts[1] - 1, d);
          if (iso <= todayIso) isoList.push(iso);
        }
      });
      if (!isoList.some(function (iso) { return entryHasSelectedData(state.entries[iso]); })) return null;
    } else {
      var dates = Object.keys(state.entries).filter(function (iso) {
        return iso <= todayIso && entryHasSelectedData(state.entries[iso]);
      }).sort();
      if (dates.length === 0) return null;
      var cur = new Date(dates[0] + "T00:00:00");
      var end = new Date(dates[dates.length - 1] + "T00:00:00");
      while (cur <= end) {
        isoList.push(isoOf(cur.getFullYear(), cur.getMonth(), cur.getDate()));
        cur.setDate(cur.getDate() + 1);
      }
    }

    var labels = [], breakBefore = [];
    isoList.forEach(function (iso, i) {
      var dt = new Date(iso + "T00:00:00");
      labels.push((dt.getMonth() + 1) + "/" + dt.getDate());
      var brk = false;
      if (i > 0) {
        var prev = new Date(isoList[i - 1] + "T00:00:00");
        prev.setDate(prev.getDate() + 1);
        brk = isoOf(prev.getFullYear(), prev.getMonth(), prev.getDate()) !== iso;
      }
      breakBefore.push(brk);
    });
    function series(field) {
      return isoList.map(function (iso) {
        var e = state.entries[iso];
        return e ? numOrNull(e[field]) : null;
      });
    }
    return { labels: labels, isoList: isoList, breakBefore: breakBefore, weight: series("weight"), waist1: series("waist1"), waist2: series("waist2") };
  }

  // Rounds an axis range out to tidy tick values (e.g. 56.0–58.5 by 0.5).
  function niceAxis(min, max, targetTicks) {
    if (min === max) { min -= 1; max += 1; }
    var pad = (max - min) * 0.08;
    min -= pad; max += pad;
    var raw = (max - min) / targetTicks;
    var mag = Math.pow(10, Math.floor(Math.log10(raw)));
    var steps = [1, 2, 2.5, 5, 10];
    var step = mag;
    for (var i = 0; i < steps.length; i++) { if (steps[i] * mag >= raw) { step = steps[i] * mag; break; } }
    var lo = Math.floor(min / step) * step;
    var hi = Math.ceil(max / step) * step;
    var ticks = [];
    for (var v = lo; v <= hi + step / 2; v += step) ticks.push(Math.round(v * 100) / 100);
    return { min: lo, max: hi, ticks: ticks };
  }

  function svgEl(tag, attrs) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  // Drawn by hand as SVG (no chart library), so it works offline and loads
  // instantly like the rest of the app.
  function renderGraph() {
    var wrap = document.getElementById("graphCanvasWrap");
    var legend = document.getElementById("graphLegend");
    var note = document.getElementById("graphNote");
    if (!wrap) return;
    wrap.innerHTML = "";
    legend.innerHTML = "";
    note.textContent = "";

    if (!graphState.weight && !graphState.waist) {
      wrap.innerHTML = '<div class="weekly-empty-note">보고 싶은 항목을 선택해주세요.</div>';
      return;
    }
    var data = buildGraphData();
    if (!data) {
      wrap.innerHTML = '<div class="weekly-empty-note">이 기간에 기록이 없어요.</div>';
      return;
    }

    var both = graphState.weight && graphState.waist;
    var series = [];
    if (graphState.weight) series.push({ key: "weight", label: "체중", unit: "kg", axis: "kg", values: data.weight, color: GRAPH_COLORS.weight });
    if (graphState.waist) {
      series.push({ key: "waist1", label: "허리1", unit: "cm", axis: "cm", values: data.waist1, color: GRAPH_COLORS.waist1 });
      series.push({ key: "waist2", label: "허리2", unit: "cm", axis: "cm", values: data.waist2, color: GRAPH_COLORS.waist2 });
    }

    var W = wrap.clientWidth || 320;
    var H = wrap.clientHeight || 280;
    var m = { top: 12, right: both ? 44 : 12, bottom: 26, left: 44 };
    var plotW = W - m.left - m.right;
    var plotH = H - m.top - m.bottom;
    var n = data.labels.length;
    function xAt(i) { return m.left + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW); }

    // One y-scale per unit.
    var axes = {};
    ["kg", "cm"].forEach(function (unit) {
      var vals = [];
      series.forEach(function (sr) { if (sr.axis === unit) sr.values.forEach(function (v) { if (v !== null) vals.push(v); }); });
      if (!vals.length) return;
      var a = niceAxis(Math.min.apply(null, vals), Math.max.apply(null, vals), 5);
      a.y = function (v) { return m.top + plotH - ((v - a.min) / (a.max - a.min)) * plotH; };
      axes[unit] = a;
    });
    var leftAxis = graphState.weight ? "kg" : "cm";
    var rightAxis = both ? "cm" : null;

    var svg = svgEl("svg", { width: W, height: H, viewBox: "0 0 " + W + " " + H, role: "img", "aria-label": "체중·허리 치수 변화 그래프" });
    svg.style.display = "block";
    svg.style.touchAction = "pan-y";

    // Grid + axis labels (left axis gets the gridlines).
    var la = axes[leftAxis];
    la.ticks.forEach(function (t) {
      var y = la.y(t);
      svg.appendChild(svgEl("line", { x1: m.left, x2: m.left + plotW, y1: y, y2: y, stroke: "#E7EBE3", "stroke-width": 1 }));
      var tx = svgEl("text", { x: m.left - 6, y: y + 3.5, "text-anchor": "end", "font-size": 10.5, fill: "#6B7A70" });
      tx.textContent = t + leftAxis;
      svg.appendChild(tx);
    });
    if (rightAxis) {
      var ra = axes[rightAxis];
      ra.ticks.forEach(function (t) {
        var tx = svgEl("text", { x: m.left + plotW + 6, y: ra.y(t) + 3.5, "text-anchor": "start", "font-size": 10.5, fill: "#6B7A70" });
        tx.textContent = t + rightAxis;
        svg.appendChild(tx);
      });
    }

    // X labels: about 5, evenly spaced.
    var xTickCount = Math.min(5, n);
    for (var k = 0; k < xTickCount; k++) {
      var idx = xTickCount === 1 ? 0 : Math.round((k / (xTickCount - 1)) * (n - 1));
      var anchor = k === 0 ? "start" : (k === xTickCount - 1 ? "end" : "middle");
      var xl = svgEl("text", { x: xAt(idx), y: H - 8, "text-anchor": anchor, "font-size": 10.5, fill: "#6B7A70" });
      xl.textContent = data.labels[idx];
      svg.appendChild(xl);
    }

    // Where picked months aren't back to back (e.g. 6월 then 8월), draw a
    // dashed divider and don't join the lines across the skipped time.
    data.breakBefore.forEach(function (brk, i) {
      if (!brk) return;
      var bx = (xAt(i - 1) + xAt(i)) / 2;
      svg.appendChild(svgEl("line", { x1: bx, x2: bx, y1: m.top, y2: m.top + plotH, stroke: "#B7C2AF", "stroke-width": 1, "stroke-dasharray": "3 3" }));
    });

    // Lines (gaps within a stretch are bridged) + dots. Waist is measured
    // occasionally, so every measurement gets a visible dot; weight only
    // gets dots when the range is short enough for them not to clutter.
    series.forEach(function (sr) {
      var a = axes[sr.axis];
      var pts = [];
      var d = "", segOpen = false;
      sr.values.forEach(function (v, i) {
        if (data.breakBefore[i]) segOpen = false;
        if (v === null) return;
        var px = xAt(i), py = a.y(v);
        pts.push([px, py]);
        d += (segOpen ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1) + " ";
        segOpen = true;
      });
      if (pts.length > 1) {
        svg.appendChild(svgEl("path", {
          d: d.trim(),
          fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
        }));
      }
      var r = sr.axis === "cm" ? 4 : (n <= 60 ? 2.5 : 0);
      if (r || pts.length === 1) {
        pts.forEach(function (p) {
          svg.appendChild(svgEl("circle", { cx: p[0], cy: p[1], r: r || 4, fill: sr.color, stroke: "#FDFCF8", "stroke-width": 1.5 }));
        });
      }
    });

    // Hover / touch: a hairline snaps to the nearest day that has a value,
    // and one tooltip lists every selected series for that day.
    var hair = svgEl("line", { x1: 0, x2: 0, y1: m.top, y2: m.top + plotH, stroke: "#8A9689", "stroke-width": 1, visibility: "hidden" });
    svg.appendChild(hair);
    var hit = svgEl("rect", { x: m.left, y: m.top, width: plotW, height: plotH, fill: "transparent" });
    svg.appendChild(hit);
    wrap.appendChild(svg);

    var tip = document.createElement("div");
    tip.style.cssText = "position:absolute;pointer-events:none;background:#20302B;color:#fff;border-radius:6px;padding:6px 8px;font-size:11.5px;line-height:1.5;visibility:hidden;white-space:nowrap;z-index:2;";
    wrap.appendChild(tip);

    var hasAny = [];
    for (var i = 0; i < n; i++) {
      hasAny.push(series.some(function (sr) { return sr.values[i] !== null; }));
    }
    function showAt(clientX) {
      var rect = svg.getBoundingClientRect();
      var x = clientX - rect.left;
      var rawIdx = n === 1 ? 0 : Math.round(((x - m.left) / plotW) * (n - 1));
      rawIdx = Math.max(0, Math.min(n - 1, rawIdx));
      var best = -1;
      for (var d = 0; d < n; d++) {
        if (rawIdx - d >= 0 && hasAny[rawIdx - d]) { best = rawIdx - d; break; }
        if (rawIdx + d < n && hasAny[rawIdx + d]) { best = rawIdx + d; break; }
      }
      if (best < 0) return;
      var hx = xAt(best);
      hair.setAttribute("x1", hx); hair.setAttribute("x2", hx);
      hair.setAttribute("visibility", "visible");

      tip.textContent = "";
      var dt = new Date(data.isoList[best] + "T00:00:00");
      var title = document.createElement("div");
      title.style.cssText = "color:#C9D0C7;font-size:10.5px;";
      title.textContent = (dt.getMonth() + 1) + "/" + dt.getDate() + " (" + WEEKDAYS[dt.getDay()] + ")";
      tip.appendChild(title);
      series.forEach(function (sr) {
        var v = sr.values[best];
        if (v === null) return;
        var row = document.createElement("div");
        var key = document.createElement("span");
        key.style.cssText = "display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle;background:" + sr.color;
        var val = document.createElement("b");
        val.textContent = v + sr.unit;
        var lab = document.createElement("span");
        lab.style.cssText = "color:#C9D0C7;margin-left:5px;";
        lab.textContent = sr.label;
        row.appendChild(key); row.appendChild(val); row.appendChild(lab);
        tip.appendChild(row);
      });
      tip.style.visibility = "visible";
      var tw = tip.offsetWidth;
      var left = hx + 10;
      if (left + tw > W) left = hx - tw - 10;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = m.top + "px";
    }
    function hide() {
      hair.setAttribute("visibility", "hidden");
      tip.style.visibility = "hidden";
    }
    hit.addEventListener("pointermove", function (e) { showAt(e.clientX); });
    hit.addEventListener("pointerdown", function (e) { showAt(e.clientX); });
    hit.addEventListener("pointerleave", function (e) { if (e.pointerType === "mouse") hide(); });

    legend.innerHTML = series.map(function (sr) {
      var axisTxt = both ? (sr.axis === "kg" ? " (왼쪽 kg)" : " (오른쪽 cm)") : "";
      return '<span class="item"><span class="key" style="background:' + sr.color + '"></span>' + sr.label + axisTxt + "</span>";
    }).join("");
    if (both) note.textContent = "체중과 허리는 단위가 달라 세로축이 따로예요. 선 기울기끼리 비교하기보다 각각 오르내림을 보세요.";
  }

  function onGraphResize() {
    if (document.getElementById("graphCanvasWrap")) renderGraph();
  }

  function openGraphModal() {
    var root = document.getElementById("graphModalRoot");
    root.innerHTML =
      '<div class="bulk-overlay" id="graphOverlay">' +

    function syncChips() {

    document.getElementById("graphMonthPickBtn").addEventListener("click", function () {

  // Same month grid as 주간 평균's 월 선택 (several months can be picked).
  // 적용 with nothing picked goes back to 전체.
  function openGraphMonthPicker(onApply) {
    var pickYear = state.viewYear;
    var draftMonths = graphState.range === "months" ? graphState.months.slice() : [];
    if (draftMonths.length) pickYear = Number(draftMonths.slice().sort()[draftMonths.length - 1].split("-")[0]);

    function render() {
      var buttons = "";
      for (var mth = 1; mth <= 12; mth++) {
        var ym = pickYear + "-" + pad2(mth);
        var active = draftMonths.indexOf(ym) !== -1;
        buttons += '<button type="button" class="month-grid-btn' + (active ? " active" : "") + '" data-ym="' + ym + '">' + mth + "월</button>";
      }
      var inner =
        '<div class="bulk-modal" style="max-width:320px;">' +
          '<div class="bulk-head">' +
            '<div class="title">월 선택</div>' +
            '<button class="bulk-close-btn" id="graphPickCloseBtn">✕</button>' +
          '</div>' +
          '<div class="month-picker-nav">' +
            '<button type="button" class="nav-arrow" id="graphPickPrev">‹</button>' +
            '<div class="title" style="font-size:15px;">' + pickYear + '년</div>' +
            '<button type="button" class="nav-arrow" id="graphPickNext">›</button>' +
          '</div>' +
          '<div class="month-grid">' + buttons + '</div>' +
          '<button class="bulk-save-btn" id="graphPickApplyBtn" style="width:100%;">적용</button>' +
        '</div>';
      var overlay = document.getElementById("graphMonthPickerOverlay");
      if (!overlay) {
        document.getElementById("graphModalRoot").insertAdjacentHTML("beforeend",
          '<div class="bulk-overlay" id="graphMonthPickerOverlay" style="z-index:70;"></div>');
        overlay = document.getElementById("graphMonthPickerOverlay");
        overlay.addEventListener("click", function (e) {
          if (e.target.id === "graphMonthPickerOverlay") close();
        });
      }
      overlay.innerHTML = inner;
      document.getElementById("graphPickCloseBtn").addEventListener("click", close);
      document.getElementById("graphPickPrev").addEventListener("click", function () { pickYear -= 1; render(); });
      document.getElementById("graphPickNext").addEventListener("click", function () { pickYear += 1; render(); });
      Array.prototype.forEach.call(overlay.querySelectorAll(".month-grid-btn"), function (btn) {
        btn.addEventListener("click", function () {
          var ym = btn.getAttribute("data-ym");
          var idx = draftMonths.indexOf(ym);
          if (idx === -1) draftMonths.push(ym); else draftMonths.splice(idx, 1);
          btn.classList.toggle("active", idx === -1);
        });

      document.getElementById("graphPickApplyBtn").addEventListener("click", function () {
        graphState.months = draftMonths.slice();
        graphState.range = draftMonths.length ? "months" : "all";
        close();
        onApply();
      });
    }
    function close() {
      var el = document.getElementById("graphMonthPickerOverlay");
      if (el) el.remove();
    }
    render();
  }

  // ---- month navigation --------------------------------------------------
  document.getElementById("prevMonthBtn").addEventListener("click", function () {
    if (state.viewMonth === 0) { state.viewYear -= 1; state.viewMonth = 11; }
    else { state.viewMonth -= 1; }
    renderCalendar();
  });
  document.getElementById("nextMonthBtn").addEventListener("click", function () {
    if (state.viewMonth === 11) { state.viewYear += 1; state.viewMonth = 0; }
    else { state.viewMonth += 1; }
    renderCalendar();
  });

  // ---- init ---------------------------------------------------------------
  var cachedEntries = loadCachedEntries();
  if (cachedEntries) state.entries = cachedEntries;

  renderWeekdayRow();
  renderCalendar(); // show instantly — cached data if we have it, otherwise an empty grid

  // Anything left unsent from last time (app closed mid-upload, no signal)
  // gets sent now.
  if (outboxSize() > 0) processOutbox();

  // Refresh from Google Sheets in the background. The calendar is already
  // interactive by this point, so this no longer blocks anything.
  // null means the load failed — keep the cached calendar on screen and
  // leave the cache untouched instead of wiping both with an empty result.
  var loadStartedAt = Date.now();
  loadAllEntries().then(function (entries) {
    if (entries === null) return;
    // Days still waiting in the save queue, or edited while this load was
    // running, keep their on-screen version — the sheet doesn't have the
    // change yet, so taking the sheet's copy would undo it.
    Object.keys(localEditedAt).concat(Object.keys(outbox)).forEach(function (iso) {
      var pending = !!outbox[iso];
      var editedDuringLoad = (localEditedAt[iso] || 0) >= loadStartedAt;
      if (!pending && !editedDuringLoad) return;
      if (state.entries[iso]) entries[iso] = state.entries[iso];
      else delete entries[iso];
    });
    state.entries = entries;
    renderCalendar();
    saveCachedEntries(entries);
  });
})();
</script>
</body>
</html>
