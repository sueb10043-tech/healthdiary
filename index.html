<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>health diary</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E7EBE3; color: #20302B; font-family: 'Work Sans', sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }
  textarea:focus, input:focus, button:focus-visible { outline: 2px solid #7E8F3F; outline-offset: 2px; }
  #wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 64px; }

  .eyebrow { font-family: 'Work Sans', sans-serif; font-size: 12px; letter-spacing: 0.12em; color: #6B7A70; }
  .top-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .save-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 7px; vertical-align: middle; background: transparent; transition: background 0.2s; }
  .save-dot.saving { background: #D9A441; }
  .save-dot.success { background: #7E8F3F; }
  .save-dot.error { background: #C0392B; }

  .error-box { background: #F4E6E2; border: 1px solid #D9B8AE; color: #8C4A3C; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; margin-bottom: 20px; }

  .cal-card { background: #FDFCF8; border: 1px solid #D7DED2; border-radius: 14px; padding: 18px; margin-top: 22px; }
  .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav button { background: transparent; border: none; padding: 6px 10px; color: #5B6B63; font-size: 18px; border-radius: 6px; }
  .cal-nav button:hover { background: #EEF1E4; }
  .cal-title { font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .cal-weekday { text-align: center; font-size: 11.5px; color: #8A9689; font-family: 'IBM Plex Mono', monospace; padding: 2px 0 6px; }
  .cal-weekday.sun { color: #C0392B; }
  .cal-weekday.sat { color: #2E5E8C; }

  .cal-cell { position: relative; aspect-ratio: 1 / 1; border-radius: 9px; border: 1px solid #E1E6DC; background-color: #F6F7F2; padding: 3px 4px; overflow: hidden; display: flex; flex-direction: column; }
  .cal-cell.today { border: 1.5px solid #7E8F3F; }
  .cal-cell .top-row { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .cal-cell .day-num { font-size: 11.5px; font-family: 'IBM Plex Mono', monospace; color: #3A463F; }
  .cal-cell.sun .day-num { color: #C0392B; }
  .cal-cell.sat .day-num { color: #2E5E8C; }
  .cal-cell.today .day-num { color: #4C5C2F; font-weight: 600; }
  .cal-cell .day-num.flag-cheat, .cal-cell .day-num.flag-drink, .cal-cell .day-num.flag-both {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 50%; color: #fff !important; font-weight: 600;
  }
  .cal-cell .day-num.flag-cheat { background: #2E5E8C; }
  .cal-cell .day-num.flag-drink { background: #C0392B; }
  .cal-cell .day-num.flag-both { background: linear-gradient(90deg, #2E5E8C 50%, #C0392B 50%); }
  .cal-cell .exercise-emoji { font-size: 10px; line-height: 1; }
  .cal-cell .icon-group { display: flex; gap: 2px; }
  .cal-cell .data-stack { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .cal-cell .data-row { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: flex-start; overflow: hidden; }
  .cal-cell .cond-emoji { font-size: 10px; line-height: 1; }
  .cal-cell .stat-txt { font-size: 8px; font-family: 'Work Sans', sans-serif; font-weight: 500; line-height: 1; color: #5B6B63; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .overlay { position: fixed; inset: 0; background: rgba(20,28,20,0.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .modal { background: #FDFCF8; border-radius: 16px; padding: 22px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; animation: popIn 0.16s ease-out; }
  @keyframes popIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .modal-head .yr { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B7A70; }
  .modal-head .date-title { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 600; }
  .close-btn { background: #F0F2EB; border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: #5B6B63; font-size: 15px; }

  .photo-cal-row { display: flex; gap: 10px; margin-bottom: 18px; align-items: flex-start; }
  .photo-slot { flex: 1; position: relative; min-width: 0; }
  .photo-placeholder { width: 100%; height: 160px; border: 1.5px dashed #B7C2AF; border-radius: 10px; background: #F3F5EE; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #5B6B63; padding: 8px; }
  .photo-placeholder-btn { background: transparent; border: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: inherit; cursor: pointer; flex: 1; width: 100%; }
  .photo-placeholder .icon { font-size: 17px; }
  .photo-placeholder .txt { font-size: 11px; }
  .paste-catcher { width: 100%; max-width: 200px; border: 1px dashed #C9D0C7; border-radius: 6px; padding: 5px 8px; font-size: 16px; color: #8A9689; text-align: center; background: #fff; }
  .paste-catcher::placeholder { color: #5B6B63; font-size: 11px; font-family: 'Work Sans', sans-serif; }
  .photo-preview-wrap { position: relative; height: 160px; overflow: hidden; border-radius: 10px; border: 1px solid #D7DED2; background: #F3F5EE; }
  .photo-preview-wrap img { position: absolute; left: 0; bottom: 0; width: 100%; height: auto; display: block; cursor: zoom-in; }
  .photo-btn { position: absolute; background: rgba(32,48,43,0.72); border: none; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 10.5px; }
  .photo-btn.remove { top: 5px; right: 5px; }
  .photo-btn.swap { bottom: 5px; right: 5px; width: auto; border-radius: 6px; padding: 3px 7px; font-size: 9.5px; }

  .stat-col { flex: 1; min-width: 0; height: 160px; display: flex; flex-direction: column; gap: 6px; }
  .stat-box { flex: 1; min-width: 0; min-height: 0; border: 1px solid #D7DED2; border-radius: 8px; background: #fff; display: flex; flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px; padding: 3px 8px 3px 14px; overflow: hidden; }
  .stat-box .stat-label { flex: 0 0 54px; text-align: right; font-family: 'Work Sans', sans-serif; font-size: 9px; color: #8A9689; white-space: nowrap; }
  .stat-box input { flex: 0 1 42px; min-width: 0; border: none; text-align: right; font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 600; color: #20302B; background: transparent; }
  .stat-box .unit { font-size: 9px; color: #8A9689; flex-shrink: 0; }

  .field-label { font-family: 'Work Sans', sans-serif; font-size: 12.5px; color: #5B6B63; margin-bottom: 8px; display: block; }

  .cond-row { display: flex; gap: 6px; margin-bottom: 18px; }
  .cond-btn { flex: 1; padding: 8px 2px; border-radius: 8px; border: 1px solid #D7DED2; background: #fff; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cond-btn .cond-btn-emoji { font-size: 18px; line-height: 1; }
  .cond-btn .lbl { font-size: 11px; color: #20302B; text-align: center; line-height: 1.2; }
  .cond-btn.active .lbl { font-weight: 600; }

  .note-box { margin-bottom: 18px; }
  .note-box textarea { width: 100%; border: 1px solid #D7DED2; border-radius: 8px; padding: 9px 10px; font-size: 13.5px; font-family: inherit; resize: vertical; }

  .exercise-row { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .flag-right-group { display: flex; gap: 8px; margin-left: auto; }
  .exercise-toggle { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; border: 1px solid #D7DED2; background: #fff; cursor: pointer; font-size: 13px; color: #20302B; }
  .exercise-toggle.active { border: 1.5px solid #7E8F3F; background: #EEF1E4; font-weight: 600; }
  .exercise-cal { display: flex; align-items: center; gap: 6px; }
  .exercise-cal input { width: 56px; border: 1px solid #D7DED2; border-radius: 8px; padding: 8px 10px; font-size: 13.5px; font-family: 'Work Sans', sans-serif; text-align: center; }
  .exercise-cal input:disabled { background: #F0F2EB; color: #A9B3AC; cursor: not-allowed; }
  .exercise-cal span { font-size: 11.5px; color: #8A9689; }

  .action-row { display: flex; gap: 8px; }
  .del-btn { background: #F4E6E2; color: #8C4A3C; border: none; border-radius: 9px; padding: 0 16px; display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
  .save-btn { flex: 1; background: #7E8F3F; color: #fff; border: none; border-radius: 9px; padding: 11px 0; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .save-btn[disabled] { background: #8FA070; cursor: default; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #20302B; color: #fff; padding: 9px 18px; border-radius: 20px; font-size: 13px; z-index: 60; }

  .lightbox-overlay { position: fixed; inset: 0; background: rgba(10,14,10,0.88); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 100; }
  .lightbox-overlay img { max-width: 100%; max-height: 100%; border-radius: 8px; display: block; }
  .lightbox-close { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,0.15); border: none; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px; }

  .spin { display: inline-block; animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .empty-note { color: #6B7A70; font-size: 13.5px; padding: 24px 0; display: flex; align-items: center; gap: 8px; }

  .bulk-open-btn { background: #FDFCF8; border: 1px solid #D7DED2; border-radius: 20px; padding: 6px 14px; font-size: 12px; color: #20302B; cursor: pointer; }
  .bulk-open-btn:hover { background: #F0F2EB; }

  .bulk-overlay { position: fixed; inset: 0; background: rgba(20,28,20,0.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 55; }
  .bulk-modal { background: #FDFCF8; border-radius: 16px; padding: 20px; width: 100%; max-width: 720px; max-height: 92vh; display: flex; flex-direction: column; animation: popIn 0.16s ease-out; }
  .bulk-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .bulk-head .title { font-family: 'Work Sans', sans-serif; font-size: 19px; font-weight: 600; }
  .bulk-range-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bulk-load-btn { background: #7E8F3F; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .bulk-table-wrap { overflow: auto; border: 1px solid #E1E6DC; border-radius: 10px; flex: 1; min-height: 0; }
  .bulk-table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  .bulk-table th { position: sticky; top: 0; background: #F3F5EE; text-align: left; padding: 8px 6px; font-family: 'Work Sans', sans-serif; font-size: 11px; color: #5B6B63; border-bottom: 1px solid #E1E6DC; white-space: nowrap; }
  .bulk-table td { padding: 5px 6px; border-bottom: 1px solid #EEF0EA; vertical-align: middle; }
  .bulk-table tr.weekend-sun .date-cell { color: #C0392B; }
  .bulk-table tr.weekend-sat .date-cell { color: #2E5E8C; }
  .bulk-table .date-cell { font-family: 'IBM Plex Mono', monospace; white-space: nowrap; font-size: 12px; }
  .bulk-table input[type="number"] { width: 64px; border: 1px solid #D7DED2; border-radius: 6px; padding: 5px 6px; font-family: 'Work Sans', sans-serif; font-size: 12px; }
  .bulk-table input[type="text"] { width: 130px; border: 1px solid #D7DED2; border-radius: 6px; padding: 5px 6px; font-size: 12px; font-family: inherit; }
  .bulk-cond-cell { display: flex; gap: 2px; }
  .bulk-cond-btn { border: 1px solid #D7DED2; background: #fff; border-radius: 6px; width: 24px; height: 24px; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
  .bulk-cond-btn.active { border: 1.5px solid #7E8F3F; background: #EEF1E4; }
  .bulk-ex-cell { display: flex; align-items: center; gap: 4px; }
  .bulk-ex-cell input[type="checkbox"] { width: 15px; height: 15px; }
  .bulk-ex-cell input[type="number"] { width: 52px; }
  .bulk-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 10px; }
  .bulk-foot .status { font-size: 12px; color: #6B7A70; flex: 1; }
  .bulk-save-btn { background: #7E8F3F; color: #fff; border: none; border-radius: 9px; padding: 10px 20px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .bulk-save-btn[disabled] { background: #8FA070; cursor: default; }
  .bulk-close-btn { background: #F0F2EB; border: none; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; color: #5B6B63; font-size: 15px; cursor: pointer; }
  /* On wider (PC) screens, scale the whole calendar up — the aspect-ratio
     on each cell keeps them square, so this just makes everything bigger,
     not distorted. */
  @media (min-width: 720px) {
    #wrap { max-width: 900px; }
    .cal-card { padding: 26px; }
    .cal-grid { gap: 8px; }
    .cal-title { font-size: 20px; font-family: 'Work Sans', sans-serif; }
    .cal-weekday { font-size: 14px; padding: 3px 0 9px; font-family: 'Work Sans', sans-serif; }
    .cal-cell { padding: 6px 8px; border-radius: 12px; }
    .cal-cell .day-num { font-size: 15px; font-family: 'Work Sans', sans-serif; }
    .cal-cell .exercise-emoji { font-size: 14px; }
    .cal-cell .cond-emoji { font-size: 14px; }
    .cal-cell .stat-txt { font-size: 12.5px; }
    .cal-cell .day-num.flag-cheat, .cal-cell .day-num.flag-drink, .cal-cell .day-num.flag-both { width: 24px; height: 24px; }
  }

  /* On phones, trim the wasted outer padding and stretch each date cell
     taller (instead of a fixed square) so the grid fills more of the
     screen, closer to a native calendar app. */
  @media (max-width: 480px) {
    #wrap { padding: 14px 4px 24px; }
    .top-header-row { margin-bottom: 7px; padding: 0 6px; }

    /* Drop the card surface entirely — background stays whatever the page
       already is — so the table itself can run edge to edge. */
    .cal-card { padding: 0; border: none; background: transparent; border-radius: 0; }

    /* Plain table look instead of nested rounded boxes: no gap between
       cells, thin dividing lines instead, plain white cell background. */
    .cal-grid { gap: 0; border-top: 1px solid #E1E6DC; border-left: 1px solid #E1E6DC; }
    .cal-nav { padding: 0 6px; }
    .cal-weekday { padding: 2px 0 4px; border-right: 1px solid #E1E6DC; border-bottom: 1px solid #E1E6DC; }
    .cal-cell, .cal-cell-empty {
      aspect-ratio: auto;
      min-height: 77px;
      padding: 4px 5px;
      border-radius: 0;
      border: none;
      border-right: 1px solid #E1E6DC;
      border-bottom: 1px solid #E1E6DC;
      background-color: #ffffff;
    }
    .cal-cell.today { border: none; border-right: 1px solid #E1E6DC; border-bottom: 1px solid #E1E6DC; box-shadow: inset 0 0 0 1.5px #7E8F3F; }
    .cal-cell .cond-emoji { font-size: 7.5px; letter-spacing: -0.5px; }

    /* Keeping the actual input at 16px stops iOS Safari's auto-zoom on
       focus; the label/unit are plain text (not focusable), so they don't
       need to be that big — reverting them to the compact size frees up
       room so the value itself doesn't get clipped. */
    .stat-box input { font-size: 16px; }
    .exercise-cal input { font-size: 16px; width: 60px; }
    .note-box textarea { font-size: 16px; }

    /* Reduce the box's own left margin instead of resizing the columns —
       photo and stat-col stay at their normal 1:1 split. */
    .stat-box { padding-left: 8px; }

    /* The toast used to sit right over the modal's save/delete buttons on
       phones — push it up above them instead. */
    .toast { bottom: 90px; }

    /* Not enough width for icon + label on all three flag buttons at once —
       show just the emoji on mobile. */
    .exercise-toggle .flag-label { display: none; }
  }
</style>
</head>
<body>
  <div id="wrap">
    <div class="top-header-row">
      <div class="eyebrow">DAILY LOG<span id="saveStatusDot" class="save-dot"></span></div>
      <div style="display:flex; gap:8px;">
        <button id="exportImageBtn" class="bulk-open-btn">📊 표로 저장</button>
        <button id="openBulkBtn" class="bulk-open-btn">📋 일괄 입력</button>
      </div>
    </div>

    <div id="errorBox"></div>

    <div class="cal-card">
      <div class="cal-nav">
        <button id="prevMonthBtn" aria-label="이전 달">‹</button>
        <div class="cal-title" id="calTitle"></div>
        <button id="nextMonthBtn" aria-label="다음 달">›</button>
      </div>
      <div class="cal-grid" id="weekdayRow"></div>
      <div class="cal-grid" id="calGrid" style="margin-top:5px;"></div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="bulkModalRoot"></div>
  <div id="lightboxRoot"></div>
  <div id="toastRoot"></div>

<script>
(function () {
  "use strict";

  var CONDITION_LEVELS = [
    { value: "success2", label: "성공!", emoji: "\uD83D\uDC99" },
    { value: "success", label: "성공", emoji: "\uD83D\uDC9A" },
    { value: "uncomfortable", label: "불편", emoji: "\uD83D\uDE30" },
    { value: "allergy", label: "알러지", emoji: "\uD83E\uDD22" }
  ];
  var WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];
  var EXERCISE_EMOJI = "💪"; // shown next to the date number on days marked as exercised
  // Paste the Web App URL you get after deploying the Apps Script (Code.gs)
  // as a Web App. Looks like: https://script.google.com/macros/s/AKfycb.../exec
  var GAS_URL = "https://script.google.com/macros/s/AKfycby59a7FI0_Te-tuvEcUtpNUCt9j5G2i96ZW8AcJME3eA6ztoQpWFaraKw9h8FD8lqt4/exec";

  var state = {
    entries: {},
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth(),
    modalDate: null
  };

  // Holds the in-progress edit for whichever date is open in the modal,
  // so typing doesn't force a full re-render (which would lose focus).
  // photoIsNew: a fresh photo was picked/pasted and needs uploading on save.
  // removePhoto: the existing remote photo should be deleted on save.
  var draft = { photo: null, condition: [], photoFileId: "", photoIsNew: false, removePhoto: false };
  var pasteHandler = null;

  // Older entries stored a single condition value; normalize to an array
  // so both old and new (multi-select) entries render the same way.
  function toConditionArray(c) {
    if (!c) return [];
    return Array.isArray(c) ? c : [c];
  }

  // Always display multiple condition emojis in the fixed CONDITION_LEVELS
  // order, regardless of the order they were clicked in.
  function sortConditionValues(arr) {
    return arr.slice().sort(function (a, b) {
      var ia = CONDITION_LEVELS.findIndex(function (l) { return l.value === a; });
      var ib = CONDITION_LEVELS.findIndex(function (l) { return l.value === b; });
      return ia - ib;
    });
  }

  function pad2(n) { return String(n).padStart(2, "0"); }
  function isoOf(y, m, d) { return y + "-" + pad2(m + 1) + "-" + pad2(d); }
  function todayStr() {
    var d = new Date();
    return isoOf(d.getFullYear(), d.getMonth(), d.getDate());
  }
  // Empty photo slot: a normal button for tapping to pick a file, plus a
  // separate small text input purely so mobile browsers have something
  // focusable to long-press and choose "Paste" on — phones have no Ctrl+V,
  // so without a real editable target here, pasting an image never worked
  // on mobile even though it worked fine on desktop.
  function emptyPhotoPlaceholderHtml() {
    return '<div class="photo-placeholder">' +
      '<button type="button" class="photo-placeholder-btn" id="photoPlaceholderBtn">' +
        '<span class="icon">📷</span><span class="txt">식단 사진 올리기</span>' +
      '</button>' +
      '<input type="text" class="paste-catcher" id="pasteCatcherInput" placeholder="붙여넣기" />' +
    '</div>';
  }

  function formatDateLong(iso) {
    var d = new Date(iso + "T00:00:00");
    return (d.getMonth() + 1) + "월 " + d.getDate() + "일 (" + WEEKDAYS[d.getDay()] + ")";
  }
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  // ---- storage (Google Sheets via Apps Script Web App) -------------------
  // text/plain avoids a CORS preflight (Apps Script doesn't handle OPTIONS),
  // and doPost/doGet on the Apps Script side JSON.parse the body regardless.
  function gasFetch(params, body) {
    var url = GAS_URL + (params ? "?" + params : "");
    var opts = body
      ? { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }
      : { method: "GET" };
    return fetch(url, opts).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  // Cache the last-loaded entries locally so the calendar can render
  // instantly on repeat visits instead of waiting on the network every time.
  // Google Sheets stays the source of truth — this is only ever overwritten
  // by a fresh fetch, never the other way around.
  var ENTRY_CACHE_KEY = "dietlog_entries_cache_v1";
  function loadCachedEntries() {
    try {
      var raw = localStorage.getItem(ENTRY_CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }
  function saveCachedEntries(entries) {
    try {
      localStorage.setItem(ENTRY_CACHE_KEY, JSON.stringify(entries));
    } catch (e) {
      /* storage full or unavailable — safe to ignore, caching is optional */
    }
  }

  function loadAllEntries() {
    if (!GAS_URL || GAS_URL.indexOf("PASTE_YOUR") === 0) {
      document.getElementById("errorBox").innerHTML =
        '<div class="error-box">Google Sheets 연결 주소(GAS_URL)가 아직 설정되지 않았어요. 코드 상단의 GAS_URL 값을 배포한 웹앱 주소로 바꿔주세요.</div>';
      return Promise.resolve({});
    }
    return gasFetch("action=list").then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || "list failed");
      return res.entries || {};
    }).catch(function (err) {
      document.getElementById("errorBox").innerHTML =
        '<div class="error-box">기록을 불러오지 못했어요. 인터넷 연결과 Google Sheets 연결 주소를 확인해주세요.</div>';
      return {};
    });
  }

  function saveEntryToSheet(dateIso, payload) {
    payload.action = "save";
    payload.date = dateIso;
    return gasFetch(null, payload).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || "save failed");
      return res;
    });
  }

  function deleteEntryFromSheet(dateIso) {
    return gasFetch(null, { action: "delete", date: dateIso }).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.error) || "delete failed");
      return res;
    });
  }

  // ---- image compression --------------------------------------------
  function fileToCompressedDataUrl(file, maxSize, quality) {
    maxSize = maxSize || 1080;
    quality = quality || 0.78;
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("read failed")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("image load failed")); };
        img.onload = function () {
          var width = img.width, height = img.height;
          if (width > height && width > maxSize) {
            height = Math.round((height * maxSize) / width);
            width = maxSize;
          } else if (height > maxSize) {
            width = Math.round((width * maxSize) / height);
            height = maxSize;
          }
          var canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          var ctx = canvas.getContext("2d");
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function showToast(msg) {
    var root = document.getElementById("toastRoot");
    root.innerHTML = '<div class="toast">' + escapeHtml(msg) + "</div>";
    setTimeout(function () { root.innerHTML = ""; }, 2200);
  }

  // Small colored dot next to "DAILY LOG": orange while a save is in
  // flight, green once it's confirmed, red if it failed. Fades back to
  // neutral after a bit so it doesn't just sit there looking stale.
  var saveStatusTimer = null;
  function setSaveStatus(status) {
    var dot = document.getElementById("saveStatusDot");
    if (!dot) return;
    dot.className = "save-dot" + (status ? " " + status : "");
    clearTimeout(saveStatusTimer);
    if (status === "success" || status === "error") {
      saveStatusTimer = setTimeout(function () {
        dot.className = "save-dot";
      }, status === "success" ? 2500 : 4500);
    }
  }

  // ---- calorie auto-read (OCR) ------------------------------------------
  // Looks for the "총 섭취 / 목표" line, e.g. "1,452 / 1,820kcal", and pulls
  // out the first (consumed) number. Runs on the original, uncompressed
  // photo so small digits stay legible.
  function extractCaloriesFromOcrText(text) {
    if (!text) return null;
    var m = text.match(/([0-9][0-9,\.]{1,7})\s*\/\s*[0-9][0-9,\.]{1,7}\s*k?cal/i);
    if (!m) return null;
    var num = parseInt(m[1].replace(/[,\.]/g, ""), 10);
    if (isNaN(num)) return null;
    return String(num);
  }
  function setCaloriesOcrState(loading) {
    var label = document.getElementById("caloriesLabel");
    if (label) label.textContent = loading ? "총 칼로리 (인식 중…)" : "총 칼로리";
  }
  function runCalorieOcr(file) {
    if (typeof Tesseract === "undefined") return; // OCR script didn't load (e.g. offline) — skip quietly
    setCaloriesOcrState(true);
    Tesseract.recognize(file, "eng")
      .then(function (result) {
        var kcal = extractCaloriesFromOcrText(result && result.data && result.data.text);
        var input = document.getElementById("caloriesInput");
        if (kcal && input) {
          input.value = kcal;
          showToast("총 칼로리 " + kcal + "kcal 자동 입력 — 다르면 눌러서 수정하세요");
        } else {
          showToast("칼로리를 자동으로 인식하지 못했어요. 직접 입력해주세요");
        }
      })
      .catch(function () {
        showToast("칼로리 자동 인식에 실패했어요");
      })
      .finally(function () {
        setCaloriesOcrState(false);
      });
  }

  function openLightbox(src) {

  // ---- calendar rendering ---------------------------------------------
  function buildMonthMatrix(year, month) {
    var firstDay = new Date(year, month, 1);
    var startWeekday = firstDay.getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < startWeekday; i++) cells.push(null);
    for (var d = 1; d <= daysInMonth; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);
    return cells;
  }

  function conditionEmoji(value) {
    for (var i = 0; i < CONDITION_LEVELS.length; i++) {
      if (CONDITION_LEVELS[i].value === value) return CONDITION_LEVELS[i].emoji;
    }
    return null;
  }

  function renderWeekdayRow() {
    var html = "";
    WEEKDAYS.forEach(function (w, i) {
      var cls = i === 0 ? "sun" : i === 6 ? "sat" : "";
      html += '<div class="cal-weekday ' + cls + '">' + w + "</div>";
    });
    document.getElementById("weekdayRow").innerHTML = html;
  }

  function renderCalendar() {
    document.getElementById("calTitle").textContent = state.viewYear + "년 " + (state.viewMonth + 1) + "월";
    var cells = buildMonthMatrix(state.viewYear, state.viewMonth);
    var today = todayStr();
    var html = "";
    cells.forEach(function (day, idx) {
      if (day === null) { html += '<div class="cal-cell-empty"></div>'; return; }
      var iso = isoOf(state.viewYear, state.viewMonth, day);
      var entry = state.entries[iso];
      var weekdayIdx = idx % 7;
      var classes = ["cal-cell"];
      if (iso === today) classes.push("today");
      if (weekdayIdx === 0) classes.push("sun");
      if (weekdayIdx === 6) classes.push("sat");
      var condEmojis = sortConditionValues(toConditionArray(entry && entry.condition)).map(conditionEmoji).filter(Boolean);
      var weightTxt = (entry && entry.weight) ? escapeHtml(entry.weight) + "kg" : "";
      var caloriesTxt = (entry && entry.calories) ? escapeHtml(entry.calories) + "kcal" : "";
      var condTxt = condEmojis.length ? condEmojis.join("") : "";
      var leftIcons = (entry && entry.exercised)
        ? '<span class="icon-group exercise-emoji">' + EXERCISE_EMOJI + "</span>"
        : "<span></span>";
      var dayNumClass = "day-num";
      if (entry && entry.cheatDay && entry.drinking) dayNumClass += " flag-both";
      else if (entry && entry.cheatDay) dayNumClass += " flag-cheat";
      else if (entry && entry.drinking) dayNumClass += " flag-drink";

      html += '<button class="' + classes.join(" ") + '" data-date="' + iso + '">' +
        '<span class="top-row">' + leftIcons + '<span class="' + dayNumClass + '">' + day + "</span></span>" +
        '<span class="data-stack">' +
          '<span class="data-row"><span class="stat-txt">' + weightTxt + "</span></span>" +
          '<span class="data-row"><span class="stat-txt">' + caloriesTxt + "</span></span>" +
          '<span class="data-row"><span class="cond-emoji">' + condTxt + "</span></span>" +
        "</span>" +
        "</button>";
    });
    document.getElementById("calGrid").innerHTML = html;

    Array.prototype.forEach.call(document.querySelectorAll("#calGrid .cal-cell"), function (btn) {
      btn.addEventListener("click", function () { openModal(btn.getAttribute("data-date")); });
    });
  }

  // ---- modal ------------------------------------------------------------
  function openModal(iso) {
    state.modalDate = iso;
    var existing = state.entries[iso] || {};
    draft.photo = existing.photo || null;
    draft.photoFileId = existing.photoFileId || "";
    draft.photoIsNew = false;
    draft.removePhoto = false;
    draft.condition = toConditionArray(existing.condition);
    draft.exercised = !!existing.exercised;
    draft.cheatDay = !!existing.cheatDay;
    draft.drinking = !!existing.drinking;

    var condButtons = CONDITION_LEVELS.map(function (lvl) {
      var active = draft.condition.indexOf(lvl.value) !== -1;
      return '<button type="button" class="cond-btn' + (active ? " active" : "") + '" data-cond="' + lvl.value + '" ' +
        'style="' + (active ? "border:1.5px solid #7E8F3F;background:#EEF1E4;" : "") + '">' +
        '<span class="cond-btn-emoji">' + lvl.emoji + '</span>' +
        '<span class="lbl">' + lvl.label + "</span></button>";
    }).join("");

    var photoBlock = draft.photo
      ? '<div class="photo-preview-wrap"><img id="photoImg" src="' + draft.photo + '" alt="식단 사진" />' +
        '<button type="button" class="photo-btn remove" id="removePhotoBtn">✕</button>' +
        '<button type="button" class="photo-btn swap" id="swapPhotoBtn">사진 바꾸기</button></div>'
      : emptyPhotoPlaceholderHtml();

    if (pasteHandler) { window.removeEventListener("paste", pasteHandler); pasteHandler = null; }
    document.getElementById("lightboxRoot").innerHTML = "";

    var html =
      '<div class="overlay" id="overlay">' +
        '<div class="modal" id="modalBox">' +
          '<div class="modal-head">' +
            '<div><div class="yr">' + state.viewYear + '</div><div class="date-title">' + formatDateLong(iso) + '</div></div>' +
            '<button class="close-btn" id="closeModalBtn">✕</button>' +
          '</div>' +

          '<div class="photo-cal-row">' +
            '<div class="photo-slot" id="photoSlot">' + photoBlock + '</div>' +
            '<div class="stat-col">' +
              '<div class="stat-box"><span class="stat-label" id="caloriesLabel">총 칼로리</span>' +
                '<input type="number" inputmode="numeric" id="caloriesInput" placeholder="0" value="' +
                  escapeHtml(existing.calories || "") + '" /><span class="unit">kcal</span></div>' +
              '<div class="stat-box"><span class="stat-label">체중</span>' +
                '<input type="number" inputmode="decimal" id="weightInput" placeholder="0" value="' +
                  escapeHtml(existing.weight || "") + '" /><span class="unit">kg</span></div>' +
              '<div class="stat-box"><span class="stat-label">허리 치수1</span>' +
                '<input type="number" inputmode="decimal" id="waist1Input" placeholder="0" value="' +
                  escapeHtml(existing.waist1 || "") + '" /><span class="unit">cm</span></div>' +
              '<div class="stat-box"><span class="stat-label">허리 치수2</span>' +
                '<input type="number" inputmode="decimal" id="waist2Input" placeholder="0" value="' +
                  escapeHtml(existing.waist2 || "") + '" /><span class="unit">cm</span></div>' +
            '</div>' +
          '</div>' +

          '<input type="file" accept="image/*" id="photoFileInput" style="display:none" />' +

          '<div style="margin-bottom:18px;">' +
            '<span class="field-label">오늘 컨디션</span>' +
            '<div class="cond-row" id="condRow">' + condButtons + '</div>' +
          '</div>' +

          '<div class="exercise-row">' +
            '<button type="button" class="exercise-toggle' + (draft.exercised ? " active" : "") + '" id="exerciseToggleBtn">' +
              '<span>' + EXERCISE_EMOJI + '</span><span class="flag-label">운동</span>' +
            '</button>' +
            '<div class="exercise-cal">' +
              '<input type="number" inputmode="numeric" id="exerciseCaloriesInput" placeholder="0" value="' +
                escapeHtml(existing.exerciseCalories || "") + '"' + (draft.exercised ? "" : " disabled") + ' /><span>kcal 소모</span>' +
            '</div>' +
            '<div class="flag-right-group">' +
              '<button type="button" class="exercise-toggle' + (draft.cheatDay ? " active" : "") + '" id="cheatToggleBtn">' +
                '<span>🍔</span><span class="flag-label">치팅</span>' +
              '</button>' +
              '<button type="button" class="exercise-toggle' + (draft.drinking ? " active" : "") + '" id="drinkToggleBtn">' +
                '<span>🍺</span><span class="flag-label">음주</span>' +
              '</button>' +
            '</div>' +
          '</div>' +

          '<div class="note-box">' +
            '<span class="field-label">메모</span>' +
            '<textarea id="noteInput" rows="3" placeholder="컨디션, 소화, 수면 등">' + escapeHtml(existing.note || "") + '</textarea>' +
          '</div>' +

          '<div class="action-row">' +
            (hasExisting ? '<button class="del-btn" id="deleteBtn">🗑 삭제</button>' : "") +
            '<button class="save-btn" id="saveBtn">✓ 저장</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById("modalRoot").innerHTML = html;
    bindModalEvents(iso);
    bindPhotoImgClick();
  }

  function closeModal() {
    state.modalDate = null;
    document.getElementById("modalRoot").innerHTML = "";
    if (pasteHandler) {
      window.removeEventListener("paste", pasteHandler);
      pasteHandler = null;
    }
  }

  function bindModalEvents(iso) {
    document.getElementById("overlay").addEventListener("click", function (e) {
      if (e.target.id === "overlay") closeModal();
    });
    document.getElementById("closeModalBtn").addEventListener("click", closeModal);

    // Allow pasting a copied image straight into the photo slot while this
    // popup is open. Defined early so it's already a real function (not
    // null) by the time photo placeholders bind it below.
    pasteHandler = function (e) {
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type && items[i].type.indexOf("image/") === 0) {
          var file = items[i].getAsFile();
          if (file) handleIncomingImageFile(file);
          break;
        }
      }
    };
    window.addEventListener("paste", pasteHandler);

    // Exercise toggle: enable/disable the burned-calories input alongside it.
    document.getElementById("exerciseToggleBtn").addEventListener("click", function (e) {
      draft.exercised = !draft.exercised;
      e.currentTarget.classList.toggle("active", draft.exercised);
      document.getElementById("exerciseCaloriesInput").disabled = !draft.exercised;
    });

    // Cheat day / drinking: simple on-off toggles, no extra fields attached.
    document.getElementById("cheatToggleBtn").addEventListener("click", function (e) {
      draft.cheatDay = !draft.cheatDay;
      e.currentTarget.classList.toggle("active", draft.cheatDay);
    });
    document.getElementById("drinkToggleBtn").addEventListener("click", function (e) {
      draft.drinking = !draft.drinking;
      e.currentTarget.classList.toggle("active", draft.drinking);
    });

    // Condition buttons: toggle without a full re-render. Multi-select.
    Array.prototype.forEach.call(document.querySelectorAll("#condRow .cond-btn"), function (btn) {
      btn.addEventListener("click", function () {
        var val = btn.getAttribute("data-cond");
        var idx = draft.condition.indexOf(val);
        if (idx === -1) draft.condition.push(val); else draft.condition.splice(idx, 1);
        Array.prototype.forEach.call(document.querySelectorAll("#condRow .cond-btn"), function (b) {
          var lvl = CONDITION_LEVELS.filter(function (l) { return l.value === b.getAttribute("data-cond"); })[0];
          var isActive = draft.condition.indexOf(lvl.value) !== -1;
          b.classList.toggle("active", isActive);
          b.style.border = isActive ? "1.5px solid #7E8F3F" : "";
          b.style.background = isActive ? "#EEF1E4" : "";
        });
      });
    });

    function bindPhotoInputTrigger(elId) {
      var el = document.getElementById(elId);
      if (el) el.addEventListener("click", function () { document.getElementById("photoFileInput").click(); });
    }
    function bindPasteCatcher() {
      var catcher = document.getElementById("pasteCatcherInput");
      if (!catcher) return;
      catcher.addEventListener("paste", pasteHandler);
      // Try reading the clipboard as soon as it's tapped, so on browsers
      // that support it a single tap is enough — no long-press needed.
      // If it's unsupported or permission isn't granted, this just fails
      // quietly and the long-press "붙여넣기" menu still works as a fallback.
      catcher.addEventListener("click", function () {
        if (!navigator.clipboard || !navigator.clipboard.read) return;
        navigator.clipboard.read().then(function (items) {
          for (var i = 0; i < items.length; i++) {
            var imageType = items[i].types.filter(function (t) { return t.indexOf("image/") === 0; })[0];
            if (imageType) {
              items[i].getType(imageType).then(function (blob) { handleIncomingImageFile(blob); });
              return;
            }
          }
        }).catch(function () { /* no permission / nothing to read — fall back to long-press */ });
      });
    }
    bindPhotoInputTrigger("photoPlaceholderBtn");
    bindPasteCatcher();
    bindPhotoInputTrigger("swapPhotoBtn");

    var removeBtn = document.getElementById("removePhotoBtn");
    if (removeBtn) removeBtn.addEventListener("click", function () {
      draft.photo = null;
      draft.photoIsNew = false;
      if (draft.photoFileId) draft.removePhoto = true;
      document.getElementById("photoSlot").innerHTML = emptyPhotoPlaceholderHtml();
      bindPhotoInputTrigger("photoPlaceholderBtn");
      bindPasteCatcher();
    });

    function applyPhotoToSlot(dataUrl) {
      draft.photo = dataUrl;
      draft.photoIsNew = true;
      draft.removePhoto = false;
      var slot = document.getElementById("photoSlot");
      slot.innerHTML =
        '<div class="photo-preview-wrap"><img id="photoImg" src="' + dataUrl + '" alt="식단 사진" />' +
        '<button type="button" class="photo-btn remove" id="removePhotoBtn">✕</button>' +
        '<button type="button" class="photo-btn swap" id="swapPhotoBtn">사진 바꾸기</button></div>';
      bindPhotoImgClick();
      document.getElementById("removePhotoBtn").addEventListener("click", function () {
        draft.photo = null;
        draft.photoIsNew = false;
        if (draft.photoFileId) draft.removePhoto = true;
        slot.innerHTML = emptyPhotoPlaceholderHtml();
        bindPhotoInputTrigger("photoPlaceholderBtn");
        bindPasteCatcher();
      });
      bindPhotoInputTrigger("swapPhotoBtn");
    }

    function handleIncomingImageFile(file) {
      if (!file) return;
      var slot = document.getElementById("photoSlot");
      slot.innerHTML = '<div class="photo-placeholder"><span class="spin">⟳</span><span class="txt">사진 처리 중…</span></div>';
      fileToCompressedDataUrl(file).then(function (dataUrl) {
        applyPhotoToSlot(dataUrl);
      }).catch(function () {
        showToast("사진 처리에 실패했어요");
        slot.innerHTML = emptyPhotoPlaceholderHtml();
        bindPhotoInputTrigger("photoPlaceholderBtn");
        bindPasteCatcher();
      });
      runCalorieOcr(file);
    }

    document.getElementById("photoFileInput").addEventListener("change", function (e) {
      var file = e.target.files && e.target.files[0];
      handleIncomingImageFile(file);
    });

    var deleteBtn = document.getElementById("deleteBtn");
    if (deleteBtn) deleteBtn.addEventListener("click", function () {
      var ok = window.confirm(formatDateLong(iso) + " 기록을 삭제할까요?\n사진을 포함한 모든 내용이 삭제되며, 되돌릴 수 없어요.");
      if (!ok) return;
      deleteBtn.disabled = true;
      deleteBtn.innerHTML = '<span class="spin">⟳</span> 삭제 중…';
      deleteEntryFromSheet(iso).then(function () {
        delete state.entries[iso];
        showToast("삭제했어요");
        closeModal();
        renderCalendar();
      }).catch(function () {
        showToast("삭제에 실패했어요. 인터넷 연결을 확인해주세요");
        deleteBtn.disabled = false;
        deleteBtn.innerHTML = "🗑 삭제";
      });
    });

    document.getElementById("saveBtn").addEventListener("click", function () {
      var weight = document.getElementById("weightInput").value.trim();
      var calories = document.getElementById("caloriesInput").value.trim();
      var note = document.getElementById("noteInput").value.trim();
      var exerciseCalories = document.getElementById("exerciseCaloriesInput").value.trim();
      var waist1 = document.getElementById("waist1Input").value.trim();
      var waist2 = document.getElementById("waist2Input").value.trim();

      if (!draft.photo && draft.condition.length === 0 && !weight && !calories && !note && !draft.exercised && !waist1 && !waist2) {
        showToast("사진이나 컨디션 중 하나는 기록해 주세요");
        return;
      }

      var payload = {
        weight: weight,
        calories: calories,
        condition: draft.condition,
        note: note,
        exercised: draft.exercised,
        exerciseCalories: draft.exercised ? exerciseCalories : "",
        cheatDay: draft.cheatDay,
        drinking: draft.drinking,
        waist1: waist1,
        waist2: waist2,
        existingPhotoFileId: draft.photoFileId || ""
      };
      if (draft.photoIsNew && draft.photo) payload.photoBase64 = draft.photo;
      if (draft.removePhoto) payload.removePhoto = true;

      // Update the local view and close the popup right away instead of
      // making the person wait on the network round trip (Drive upload +
      // sheet write). The actual confirmation — a toast either way — only
      // shows once the request truly finishes, even though it may pop up
      // after they've already moved on to something else in the app.
      state.entries[iso] = {
        weight: weight,
        calories: calories,
        condition: draft.condition,
        note: note,
        exercised: draft.exercised,
        exerciseCalories: payload.exerciseCalories,
        cheatDay: draft.cheatDay,
        drinking: draft.drinking,
        waist1: waist1,
        waist2: waist2,
        photo: draft.removePhoto ? "" : (payload.photoBase64 ? draft.photo : (state.entries[iso] && state.entries[iso].photo) || ""),
        photoFileId: draft.photoFileId || ""
      };
      closeModal();
      renderCalendar();
      setSaveStatus("saving");

      saveEntryToSheet(iso, payload).then(function (res) {
        if (state.entries[iso]) {
          state.entries[iso].photoFileId = (res && res.photoFileId) || state.entries[iso].photoFileId || "";
        }
        setSaveStatus("success");
        // Note: we skip re-fetching the whole sheet here on purpose — the
        // photo shown right after saving is the local preview; it'll switch
        // to the permanent Drive link the next time the page loads.
      }).catch(function () {
        setSaveStatus("error");
        showToast(formatDateLong(iso) + " 저장 실패 — 인터넷 연결을 확인하고 다시 시도해주세요");
      });
    });
  }

  // ---- bulk entry (multi-day table) --------------------------------------
  // Lets the person fill in weight/calories/condition/exercise for a whole
  // month at once, instead of opening each day individually.
  var bulkRows = []; // iso dates for the currently loaded month
  var bulkDraft = {}; // date -> { weight, calories, condition:[], exercised, exerciseCalories, note }
  var bulkOriginal = {}; // snapshot of the same shape, taken at load time — used to
                          // detect which rows actually changed before saving
  var bulkViewYear = new Date().getFullYear();
  var bulkViewMonth = new Date().getMonth();

  function defaultBulkDraft(existing) {
    return {
      weight: (existing && existing.weight) || "",
      calories: (existing && existing.calories) || "",
      condition: toConditionArray(existing && existing.condition).slice(),
      exercised: !!(existing && existing.exercised),
      exerciseCalories: (existing && existing.exerciseCalories) || "",
      cheatDay: !!(existing && existing.cheatDay), // not shown in this view, but preserved on save
      drinking: !!(existing && existing.drinking), // not shown in this view, but preserved on save
      note: (existing && existing.note) || "" // not shown in this view, but preserved on save
    };
  }

  function daysInMonth(y, m) { return new Date(y, m + 1, 0).getDate(); }

  function openBulkModal() {
    bulkViewYear = state.viewYear;
    bulkViewMonth = state.viewMonth;
    document.getElementById("bulkModalRoot").innerHTML =
      '<div class="bulk-overlay" id="bulkOverlay">' +
        '<div class="bulk-modal">' +
          '<div class="bulk-head">' +
            '<div class="title">일괄 입력</div>' +
            '<button class="bulk-close-btn" id="bulkCloseBtn">✕</button>' +
          '</div>' +
          '<div class="bulk-range-row">' +
            '<button class="bulk-load-btn" id="bulkPrevBtn" style="padding:9px 12px;">‹</button>' +
            '<div class="title" id="bulkMonthLabel" style="font-size:15px;flex:1;text-align:center;"></div>' +
            '<button class="bulk-load-btn" id="bulkNextBtn" style="padding:9px 12px;">›</button>' +
          '</div>' +
          '<div class="bulk-table-wrap" id="bulkTableWrap"></div>' +
          '<div class="bulk-foot">' +
            '<span class="status" id="bulkStatus"></span>' +
            '<button class="bulk-save-btn" id="bulkSaveBtn">전체 저장</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById("bulkOverlay").addEventListener("click", function (e) {
      if (e.target.id === "bulkOverlay") closeBulkModal();
    });
    document.getElementById("bulkCloseBtn").addEventListener("click", closeBulkModal);
    document.getElementById("bulkSaveBtn").addEventListener("click", saveBulkAll);
    document.getElementById("bulkPrevBtn").addEventListener("click", function () {
      if (bulkViewMonth === 0) { bulkViewYear -= 1; bulkViewMonth = 11; } else { bulkViewMonth -= 1; }
      loadBulkTable();
    });
    document.getElementById("bulkNextBtn").addEventListener("click", function () {
      if (bulkViewMonth === 11) { bulkViewYear += 1; bulkViewMonth = 0; } else { bulkViewMonth += 1; }
      loadBulkTable();
    });

    loadBulkTable();
  }

  function closeBulkModal() {
    document.getElementById("bulkModalRoot").innerHTML = "";
  }

  function loadBulkTable() {
    document.getElementById("bulkMonthLabel").textContent = bulkViewYear + "년 " + (bulkViewMonth + 1) + "월";
    var total = daysInMonth(bulkViewYear, bulkViewMonth);
    var dates = [];
    for (var d = 1; d <= total; d++) dates.push(isoOf(bulkViewYear, bulkViewMonth, d));

    bulkRows = dates;
    bulkDraft = {};
    bulkOriginal = {};
    dates.forEach(function (iso) {
      bulkDraft[iso] = defaultBulkDraft(state.entries[iso]);
      bulkOriginal[iso] = defaultBulkDraft(state.entries[iso]);
    });
    document.getElementById("bulkStatus").textContent = "기존 기록은 값이 채워져 있어요. 달을 이동하면 저장 안 한 입력은 사라져요.";
    renderBulkTable();
  }

  function renderBulkTable() {
    var rowsHtml = bulkRows.map(function (iso) {
      var d = new Date(iso + "T00:00:00");
      var wd = d.getDay();
      var rowClass = wd === 0 ? "weekend-sun" : wd === 6 ? "weekend-sat" : "";
      var draft = bulkDraft[iso];
      var condBtns = CONDITION_LEVELS.map(function (lvl) {
        var active = draft.condition.indexOf(lvl.value) !== -1;
        return '<button type="button" class="bulk-cond-btn' + (active ? " active" : "") + '" data-date="' + iso + '" data-cond="' + lvl.value + '" title="' + lvl.label + '">' + lvl.emoji + '</button>';
      }).join("");
      return (
        '<tr class="' + rowClass + '" data-row="' + iso + '">' +
          '<td class="date-cell">' + (d.getMonth() + 1) + "/" + pad2(d.getDate()) + " (" + WEEKDAYS[wd] + ")</td>" +
          '<td><input type="number" inputmode="decimal" class="bulk-weight" data-date="' + iso + '" value="' + escapeHtml(draft.weight) + '" placeholder="0" /></td>' +
          '<td><input type="number" inputmode="numeric" class="bulk-calories" data-date="' + iso + '" value="' + escapeHtml(draft.calories) + '" placeholder="kcal" /></td>' +
          '<td><div class="bulk-cond-cell">' + condBtns + '</div></td>' +
          '<td><div class="bulk-ex-cell">' +
            '<input type="checkbox" class="bulk-exercised" data-date="' + iso + '"' + (draft.exercised ? " checked" : "") + ' />' +
            '<input type="number" inputmode="numeric" class="bulk-exercise-cal" data-date="' + iso + '" value="' + escapeHtml(draft.exerciseCalories) + '" placeholder="kcal" />' +
          '</div></td>' +
        "</tr>"
      );
    }).join("");

    document.getElementById("bulkTableWrap").innerHTML =
      '<table class="bulk-table">' +
        '<thead><tr>' +
          '<th>날짜</th><th>체중(kg)</th><th>칼로리</th><th>컨디션</th><th>운동</th>' +
        "</tr></thead>" +
        "<tbody>" + rowsHtml + "</tbody>" +
      "</table>";

    bindBulkTableEvents();
  }

  // Enter moves focus to the same column's input in the next row, so a
  // whole column (e.g. all weights) can be filled without touching the mouse.
  function bindVerticalEnterNav(wrap, selector) {
    var inputs = Array.prototype.slice.call(wrap.querySelectorAll(selector));
    inputs.forEach(function (el, i) {
      el.addEventListener("keydown", function (e) {
        if (e.key !== "Enter") return;
        e.preventDefault();
        var next = inputs[i + 1];
        if (next) { next.focus(); next.select(); }
      });
    });
  }

  function bindBulkTableEvents() {
    var wrap = document.getElementById("bulkTableWrap");

    Array.prototype.forEach.call(wrap.querySelectorAll(".bulk-weight"), function (el) {
      el.addEventListener("input", function () { bulkDraft[el.getAttribute("data-date")].weight = el.value; });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".bulk-calories"), function (el) {
      el.addEventListener("input", function () { bulkDraft[el.getAttribute("data-date")].calories = el.value; });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".bulk-exercise-cal"), function (el) {
      el.addEventListener("input", function () { bulkDraft[el.getAttribute("data-date")].exerciseCalories = el.value; });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".bulk-exercised"), function (el) {
      el.addEventListener("change", function () {
        bulkDraft[el.getAttribute("data-date")].exercised = el.checked;
      });
    });
    Array.prototype.forEach.call(wrap.querySelectorAll(".bulk-cond-btn"), function (btn) {
      btn.addEventListener("click", function () {
        var iso = btn.getAttribute("data-date");
        var val = btn.getAttribute("data-cond");
        var arr = bulkDraft[iso].condition;
        var idx = arr.indexOf(val);
        if (idx === -1) arr.push(val); else arr.splice(idx, 1);
        btn.classList.toggle("active", idx === -1);
      });
    });

    bindVerticalEnterNav(wrap, ".bulk-weight");
    bindVerticalEnterNav(wrap, ".bulk-calories");
    bindVerticalEnterNav(wrap, ".bulk-exercise-cal");
  }

  // Only rows that actually differ from what was loaded need to be sent —
  // otherwise every save re-writes the whole visible month, which is what
  // made bulk saving slow.
  function bulkDraftChanged(a, b) {
    if (a.weight !== b.weight) return true;
    if (a.calories !== b.calories) return true;
    if (a.exercised !== b.exercised) return true;
    if (a.exerciseCalories !== b.exerciseCalories) return true;
    var ac = a.condition.slice().sort().join(",");
    var bc = b.condition.slice().sort().join(",");
    if (ac !== bc) return true;
    return false;
  }

  function saveBulkAll() {
    var toSave = bulkRows.filter(function (iso) { return bulkDraftChanged(bulkOriginal[iso], bulkDraft[iso]); });
    if (toSave.length === 0) {
      document.getElementById("bulkStatus").textContent = "변경된 내용이 없어요.";
      return;
    }
    var saveBtn = document.getElementById("bulkSaveBtn");
    var status = document.getElementById("bulkStatus");
    saveBtn.disabled = true;
    setSaveStatus("saving");
    var done = 0;
    var failed = [];

    function saveNext(i) {
      if (i >= toSave.length) {
        saveBtn.disabled = false;
        if (failed.length === 0) {
          setSaveStatus("success");
          showToast(done + "일 저장 완료");
          closeBulkModal();
          renderCalendar();
        } else {
          setSaveStatus("error");
          status.textContent = done + "일 저장 완료, " + failed.length + "일 실패(" + failed.join(", ") + ")";
        }
        return;
      }
      var iso = toSave[i];
      var d = bulkDraft[iso];
      status.textContent = "저장 중… (" + (i + 1) + "/" + toSave.length + ")";
      var payload = {
        weight: d.weight,
        calories: d.calories,
        condition: d.condition,
        note: d.note,
        exercised: d.exercised,
        exerciseCalories: d.exercised ? d.exerciseCalories : "",
        cheatDay: d.cheatDay,
        drinking: d.drinking,
        existingPhotoFileId: (state.entries[iso] && state.entries[iso].photoFileId) || ""
      };
      saveEntryToSheet(iso, payload).then(function (res) {
        state.entries[iso] = {
          weight: d.weight,
          calories: d.calories,
          condition: d.condition,
          note: d.note,
          exercised: d.exercised,
          exerciseCalories: payload.exerciseCalories,
          cheatDay: d.cheatDay,
          drinking: d.drinking,
          photo: (state.entries[iso] && state.entries[iso].photo) || "",
          photoFileId: (res && res.photoFileId) || (state.entries[iso] && state.entries[iso].photoFileId) || ""
        };
        // So a second "전체 저장" click (without reopening this table)
        // doesn't needlessly resend this row again.
        bulkOriginal[iso] = defaultBulkDraft(state.entries[iso]);
        done++;
        saveNext(i + 1);
      }).catch(function () {
        failed.push(iso.slice(5));
        saveNext(i + 1);
      });
    }
    saveNext(0);
  }

  // ---- month-as-image export ---------------------------------------------
  // Draws a plain text/number table (no emoji or color-only signals) so an
  // AI reading the image later can parse every value unambiguously.
  var CONDITION_EXPORT_LABELS = {
    success2: "정상 배변",
    success: "단단한 변",
    uncomfortable: "복부 가스",
    allergy: "알러지"
  };

  var EXPORT_COLUMNS = [
    { key: "date", label: "날짜", width: 62 },
    { key: "weight", label: "체중(kg)", width: 66 },
    { key: "calories", label: "칼로리(kcal)", width: 82 },
    { key: "condition", label: "컨디션", width: 150 },
    { key: "exercise", label: "운동", width: 46 },
    { key: "exCal", label: "소모(kcal)", width: 70 },
    { key: "waist1", label: "허리1(cm)", width: 70 },
    { key: "waist2", label: "허리2(cm)", width: 70 },
    { key: "cheat", label: "치팅", width: 46 },
    { key: "drink", label: "음주", width: 46 }
  ];

  function exportRowValues(e) {
    var condText = e.condition.length
      ? e.condition.map(function (v) { return CONDITION_EXPORT_LABELS[v] || v; }).join(", ")
      : "-";
    return {
      date: e.day + "(" + e.weekday + ")",
      weight: e.weight || "-",
      calories: e.calories || "-",
      condition: condText,
      exercise: e.exercised ? "O" : "-",
      exCal: e.exercised && e.exCal ? e.exCal : "-",
      waist1: e.waist1 || "-",
      waist2: e.waist2 || "-",
      cheat: e.cheat ? "O" : "-",
      drink: e.drink ? "O" : "-"
    };
  }

  function drawMonthTableCanvas(entries, year, month) {
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d");
    var scale = 2;

    var tableW = EXPORT_COLUMNS.reduce(function (a, c) { return a + c.width; }, 0);
    var rowH = 28;
    var headerH = 46;
    var headerRowH = 26;
    var totalW = tableW + 40;
    var totalH = headerH + headerRowH + rowH * entries.length + 20;

    canvas.width = totalW * scale;
    canvas.height = totalH * scale;
    ctx.scale(scale, scale);

    ctx.fillStyle = "#FDFCF8";
    ctx.fillRect(0, 0, totalW, totalH);

    ctx.fillStyle = "#20302B";
    ctx.font = "600 15px 'Work Sans', sans-serif";
    ctx.fillText(year + "년 " + (month + 1) + "월 기록", 20, 26);

    var startX = 20;
    var startY = headerH;

    ctx.fillStyle = "#F3F5EE";
    ctx.fillRect(startX, startY, tableW, headerRowH);
    ctx.fillStyle = "#3A463F";
    ctx.font = "600 11px 'IBM Plex Mono', monospace";
    var hx = startX;
    EXPORT_COLUMNS.forEach(function (col) {
      ctx.fillText(col.label, hx + 6, startY + headerRowH / 2 + 4);
      hx += col.width;
    });

    entries.forEach(function (e, rowIdx) {
      var vals = exportRowValues(e);
      var y = startY + headerRowH + rowIdx * rowH;
      if (rowIdx % 2 === 1) {
        ctx.fillStyle = "#F7F8F4";
        ctx.fillRect(startX, y, tableW, rowH);
      }
      var cx = startX;
      EXPORT_COLUMNS.forEach(function (col) {
        ctx.fillStyle = col.key === "date"
          ? (e.weekday === "일" ? "#C0392B" : e.weekday === "토" ? "#2E5E8C" : "#20302B")
          : "#20302B";
        ctx.font = "12px 'IBM Plex Mono', monospace";
        var text = String(vals[col.key]);
        var maxChars = Math.floor(col.width / 6.2);
        if (text.length > maxChars) text = text.slice(0, maxChars - 1) + "…";
        ctx.fillText(text, cx + 6, y + rowH / 2 + 4);
        cx += col.width;
      });
    });

    ctx.strokeStyle = "#D7DED2";
    ctx.lineWidth = 1;
    var gridH = headerRowH + rowH * entries.length;
    ctx.strokeRect(startX, startY, tableW, gridH);
    var vx = startX;
    EXPORT_COLUMNS.forEach(function (col, i) {
      if (i > 0) {
        ctx.beginPath();
        ctx.moveTo(vx, startY);
        ctx.lineTo(vx, startY + gridH);
        ctx.stroke();
      }
      vx += col.width;
    });
    ctx.beginPath();
    ctx.moveTo(startX, startY + headerRowH);
    ctx.lineTo(startX + tableW, startY + headerRowH);
    ctx.stroke();

    return canvas;
  }

  function exportMonthTableImage() {
    var total = daysInMonth(state.viewYear, state.viewMonth);
    var rows = [];
    for (var d = 1; d <= total; d++) {
      var iso = isoOf(state.viewYear, state.viewMonth, d);
      var entry = state.entries[iso] || {};
      var wd = new Date(iso + "T00:00:00").getDay();
      rows.push({
        day: d,
        weekday: WEEKDAYS[wd],
        weight: entry.weight || "",
        calories: entry.calories || "",
        condition: sortConditionValues(toConditionArray(entry.condition)),
        exercised: !!entry.exercised,
        exCal: entry.exerciseCalories || "",
        waist1: entry.waist1 || "",
        waist2: entry.waist2 || "",
        cheat: !!entry.cheatDay,
        drink: !!entry.drinking
      });
    }
    var canvas = drawMonthTableCanvas(rows, state.viewYear, state.viewMonth);
    var link = document.createElement("a");
    link.download = state.viewYear + "년_" + (state.viewMonth + 1) + "월_기록.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    showToast("이미지로 저장했어요");
  }

  document.getElementById("exportImageBtn").addEventListener("click", function () {
    // Give web fonts a moment to be ready so the canvas text renders with
    // the right typeface instead of a generic fallback.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(exportMonthTableImage);
    } else {
      exportMonthTableImage();
    }
  });

  document.getElementById("openBulkBtn").addEventListener("click", openBulkModal);

  // ---- month navigation --------------------------------------------------
  document.getElementById("prevMonthBtn").addEventListener("click", function () {
    if (state.viewMonth === 0) { state.viewYear -= 1; state.viewMonth = 11; }
    else { state.viewMonth -= 1; }
    renderCalendar();
  });
  document.getElementById("nextMonthBtn").addEventListener("click", function () {
    if (state.viewMonth === 11) { state.viewYear += 1; state.viewMonth = 0; }
    else { state.viewMonth += 1; }
    renderCalendar();
  });

  // ---- init ---------------------------------------------------------------
  var cachedEntries = loadCachedEntries();
  if (cachedEntries) state.entries = cachedEntries;

  renderWeekdayRow();
  renderCalendar(); // show instantly — cached data if we have it, otherwise an empty grid

  // Refresh from Google Sheets in the background. The calendar is already
  // interactive by this point, so this no longer blocks anything.
  loadAllEntries().then(function (entries) {
    state.entries = entries;
    renderCalendar();
    saveCachedEntries(entries);
  });
})();
</script>
</body>
